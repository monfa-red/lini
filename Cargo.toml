[package]
name = "lini"
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.88"
description = "From a mindmap to a blueprint: one small language for diagrams, charts, sequences, ER schemas, engineering drawings, and schematics. Compiles to clean, themeable SVG."
license = "MIT"
repository = "https://github.com/monfa-red/lini"
homepage = "https://github.com/monfa-red/lini"
documentation = "https://docs.rs/lini"
readme = "README.md"
keywords = ["diagram", "svg", "dsl", "diagrams-as-code", "graph"]
categories = ["command-line-utilities", "visualization"]
# Raw font sources are xtask input only (the committed subsets/metrics are the
# shipped artifacts) — keep the ~8 MB out of the published crate. The README's
# imagery is fetched from GitHub by URL, never from the package, so the crate
# carries none of it either; the PNGs stay in the repo because the READMEs of
# already-published versions still point at them.
exclude = ["assets/fonts/raw", "assets/*.png", "assets/*.svg", "assets/logo"]

[[bin]]
name = "lini"
path = "src/main.rs"

[lib]
name = "lini"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libm = "0.2"
ttf-parser = { version = "0.25", optional = true }

[features]
default = ["icons", "font"]
# Embed the Phosphor icon set (assets/phosphor-duotone.txt). On by default;
# `--no-default-features` drops it for a lean binary (then `|icon|` errors).
icons = []
# Embed the bundled font subsets (assets/fonts/subset/) for `--embed-font` /
# `--static` text outlining. On by default; the metrics tables are always
# compiled in regardless — layout never varies by build flags — so dropping
# this only loses the two font flags, never measurement.
font = ["dep:ttf-parser"]

[dev-dependencies]
insta = { version = "1.47", features = ["glob", "filters"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The browser build, used by `cargo xtask wasm`. Cargo reads profiles only from
# the workspace root, so `crates/lini-wasm` cannot carry its own — and the
# binary must not inherit these: `opt-level = "z"` trades the CLI's speed for
# bytes, a bargain that is only ever right over the network.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"

# `xtask` holds repo tooling (icon extraction, future font embedding);
# `crates/lini-wasm` is the browser binding, built only for wasm32 by
# `cargo xtask wasm`. Neither is part of the published crate; default-members
# keeps `cargo build/test` on lini alone, so a host-target build never tries to
# compile the cdylib.
[workspace]
members = ["xtask", "crates/lini-wasm"]
default-members = ["."]
